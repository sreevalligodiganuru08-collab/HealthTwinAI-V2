<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthTwin AI Dashboard - CodeBlue</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>💙 HealthTwin AI - <span class="team-name">CodeBlue</span></h1>
    <h3>Track. Analyze. Improve Your Health!</h3>
  </header>

  <main>
    <!-- Input Section -->
    <section class="input-section">
      <h2>Enter Your Health Data</h2>
      <form id="healthForm">
        <input type="number" name="heart_rate" placeholder="Heart Rate (bpm)" required>
        <input type="number" name="oxygen_level" placeholder="Oxygen Level (%)" required>
        <input type="number" name="steps" placeholder="Steps Walked" required>
        <input type="text" name="blood_pressure" placeholder="Blood Pressure (e.g., 120/80)" required>
        <button type="submit">💾 Save Record</button>
      </form>
    </section>

    <!-- Records Section -->
    <section class="records-section">
      <h2>Your Records</h2>
      <table id="recordsTable">
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Heart Rate</th>
            <th>Oxygen Level</th>
            <th>Steps</th>
            <th>Blood Pressure</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Health Summary -->
    <section class="summary-section">
      <h2>Health Summary</h2>
      <p id="healthSummary" class="summary-text">Your health summary will appear here.</p>
    </section>

    <!-- Pie Charts -->
    <section class="chart-section">
      <h2>Health Overview (Scores)</h2>
      <div class="charts-container">
        <canvas id="heartChart"></canvas>
        <canvas id="oxygenChart"></canvas>
        <canvas id="stepsChart"></canvas>
        <canvas id="bpChart"></canvas>
      </div>
      <p id="overallScore" style="text-align:center; font-weight:bold; margin-top:10px;"></p>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ by CodeBlue for better health tracking</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
